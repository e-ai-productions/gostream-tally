name: build windows program
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build the program
        run: pyinstaller --onefile --name gostream-tally gostream_tally.py
      - name: Store as a download
        uses: actions/upload-artifact@v4
        with:
          name: gostream-tally-windows
          path: dist/gostream-tally.exe
      - name: Also publish as a release when tagged
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/gostream-tally.exe
